<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jabba-Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --p1:#0B0B0B; --p2:#141414; --rule:#242424; --txt:#E6E6E6; --dim:#7D7D7D;
  --amb:#FFB000; --amb-d:#3A2A00; --bid:#33D17A; --bid-d:#0C2A19; --ask:#FF5A4E; --ask-d:#2E0F0C; --cy:#5CC8FF;
  --f:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{
  --bg:#F2F0EA; --p1:#FFFFFF; --p2:#ECE9E1; --rule:#D5D1C6; --txt:#141414; --dim:#6B6A66;
  --amb:#B46F00; --amb-d:#F6E7C8; --bid:#138A4B; --bid-d:#DDF1E5; --ask:#C8372C; --ask-d:#F7DEDB; --cy:#0A6FA8; color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font:12.5px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--amb);outline-offset:1px}

/* function bar */
.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:stretch;background:var(--amb);color:#000;font-weight:700;overflow-x:auto}
.fbar .logo{padding:6px 12px;background:#000;color:var(--amb);white-space:nowrap}
:root[data-theme="light"] .fbar .logo{background:#141414}
.fbar button{background:none;border:0;border-right:1px solid rgba(0,0,0,.25);padding:6px 12px;font-weight:700;white-space:nowrap;color:#000}
.fbar button kbd{font:inherit;opacity:.55;margin-right:6px}
.fbar button[aria-pressed="true"]{background:#000;color:var(--amb)}
.fbar .sp{flex:1}
.fbar .st{padding:6px 12px;white-space:nowrap;font-weight:500}

/* ticker strip */
.strip{display:flex;gap:0;border-bottom:1px solid var(--rule);background:var(--p1);overflow-x:auto}
.pair{background:none;border:0;border-right:1px solid var(--rule);padding:8px 14px;text-align:left;min-width:150px}
.pair .s{color:var(--amb);font-weight:700}
.pair .p{font-size:15px;font-weight:500}
.pair .c{font-size:11px;color:var(--dim)}
.pair[aria-pressed="true"]{background:var(--p2);box-shadow:inset 0 -2px var(--amb)}

/* layout */
.grid{display:grid;gap:1px;background:var(--rule);min-height:calc(100dvh - 110px)}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto 1fr}.tape{grid-column:1/-1}}
.pane{background:var(--bg);padding:10px 12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;color:var(--amb);font-weight:700;margin-bottom:6px}
.ph span{color:var(--dim);font-weight:400}

/* book */
.bk{width:100%;border-collapse:collapse}
.bk th{color:var(--dim);font-weight:400;text-align:right;padding:2px 6px;border-bottom:1px solid var(--rule)}
.bk th:first-child,.bk td:first-child{text-align:left}
.bk td{text-align:right;padding:3px 6px;white-space:nowrap;position:relative}
.bk tr.lv{cursor:pointer}
.bk tr.lv:hover td{background:var(--p2)}
.bk tr.sel td{background:var(--amb-d)!important}
.bk .ask{color:var(--ask)} .bk .bid{color:var(--bid)}
.bk tr.off td{color:var(--dim);text-decoration:line-through;cursor:not-allowed}
.depth{position:absolute;inset:1px 0 1px auto;z-index:-1;opacity:.9}
.bk tr.a .depth{background:var(--ask-d)} .bk tr.b .depth{background:var(--bid-d)}
.flag{display:inline-block;font-size:10px;padding:0 4px;margin-left:4px;border:1px solid currentColor;color:var(--amb);vertical-align:1px}
.flag.x{color:var(--ask)}
.mid td{padding:6px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);color:var(--dim)}
.mid b{color:var(--txt);font-weight:500}
.cross{color:#000;background:var(--amb);border:0;padding:1px 8px;font-weight:700;margin-left:8px}

/* ticket */
.side{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);margin-bottom:10px}
.side button{border:0;padding:8px;background:var(--p2);font-weight:700;color:var(--dim)}
.side button.b[aria-pressed="true"]{background:var(--bid);color:#000}
.side button.s[aria-pressed="true"]{background:var(--ask);color:#000}
.fld{display:grid;grid-template-columns:90px minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid var(--rule);padding:6px 0}
.fld label{color:var(--dim)}
.fld input{background:transparent;border:0;text-align:right;font-size:15px;width:100%;padding:2px 0}
.fld input:focus{outline:none;box-shadow:inset 0 -1px var(--amb)}
.fld .u{color:var(--dim);width:44px}
.fld .v{text-align:right;font-size:15px}
.ttl{display:flex;gap:1px;background:var(--rule);margin:10px 0}
.ttl button{flex:1;border:0;background:var(--p2);padding:6px 0;color:var(--dim)}
.ttl button[aria-pressed="true"]{color:#000;background:var(--amb)}
.go{width:100%;border:0;padding:12px;font-weight:700;font-size:14px;margin-top:6px}
.go.b{background:var(--bid);color:#000} .go.s{background:var(--ask);color:#000}
.go:disabled{background:var(--p2);color:var(--dim);cursor:not-allowed}
.msg{min-height:18px;margin-top:8px;color:var(--dim)}
.msg.e{color:var(--ask)} .msg.w{color:var(--amb)}
.pipe{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.pipe span{color:var(--dim)} .pipe span.ok{color:var(--bid)} .pipe span.run{color:var(--amb)} .pipe span.ko{color:var(--ask)}
.mode{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:8px}
.mode button{background:none;border:0;color:var(--cy);padding:0}

/* tape */
.tabs2{display:flex;gap:16px;margin-bottom:6px}
.tabs2 button{background:none;border:0;padding:0;color:var(--dim);font-weight:700}
.tabs2 button[aria-pressed="true"]{color:var(--amb)}
.tp{width:100%;border-collapse:collapse}
.tp td,.tp th{padding:3px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--p2)}
.tp th{color:var(--dim);font-weight:400}
.tp td:first-child,.tp th:first-child{text-align:left}
.tp .h{color:var(--cy)}
.tp .x{background:none;border:1px solid var(--rule);color:var(--dim);padding:0 6px}
.scroll{overflow-x:auto}
.empty{color:var(--dim);padding:8px 0}
.flash{animation:fl 1.2s ease-out}
@keyframes fl{from{background:var(--amb-d)}to{background:transparent}}
@media(prefers-reduced-motion:reduce){.flash{animation:none}}
.foot{display:flex;gap:14px;flex-wrap:wrap;padding:6px 12px;color:var(--dim);border-top:1px solid var(--rule);background:var(--p1)}
.foot button{background:none;border:0;padding:0;color:var(--dim);text-decoration:underline}
.hide{display:none!important}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.bar input{background:var(--p2);border:1px solid var(--rule);padding:5px 8px;min-width:0;flex:1}
.chips{display:flex;gap:1px;background:var(--rule);flex-wrap:wrap}
.chips button{border:0;background:var(--p2);padding:4px 9px;color:var(--dim)}
.chips button[aria-pressed="true"]{background:var(--amb);color:#000;font-weight:700}
.bk td.tk{color:var(--txt)} .bk .sym{color:var(--amb);font-weight:700}
.bk .arr{color:var(--dim);padding:0 2px}
.xbar{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--amb);padding:6px 8px;margin-bottom:8px;color:var(--amb)}
.leg2{display:grid;grid-template-columns:90px minmax(0,1fr) 92px;align-items:center;gap:8px;border-bottom:1px solid var(--rule);padding:6px 0}
.leg2 label{color:var(--dim)}
.leg2 input{background:transparent;border:0;text-align:right;font-size:15px;width:100%;padding:2px 0}
.leg2 input:focus{outline:none;box-shadow:inset 0 -1px var(--amb)}
.leg2 select{background:var(--p2);border:1px solid var(--rule);padding:4px 6px;font-weight:700;color:var(--amb)}
.leg2 .v{text-align:right;font-size:15px}
.leg2 .sym{color:var(--amb);font-weight:700;text-align:right}
.swap{display:flex;justify-content:flex-end;margin:2px 0}
.swap button{background:none;border:1px solid var(--rule);color:var(--dim);padding:0 8px}
.rate{color:var(--dim);padding:6px 0;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rate b{color:var(--txt);font-weight:500}
.bal2{color:var(--dim);font-size:11px;text-align:right;margin-top:-2px}


/* ---- ottimizzazione spazi e grafica ---- */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--rowh:30px}
body{font-size:12.5px}
.fbar button,.fbar .logo,.fbar .st{padding:7px 12px}
.grid{min-height:0;gap:1px}
@media(min-width:900px){
  .grid{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto}
  #bookPane{grid-row:1;grid-column:1} #ticket{grid-row:1/3;grid-column:2;position:sticky;top:31px;align-self:start}
  .tape{grid-column:1;grid-row:2}
}
.pane{padding:var(--s3) var(--s4)}
.ph{font-size:12px;letter-spacing:.02em;margin-bottom:var(--s2);padding-bottom:var(--s2);border-bottom:1px solid var(--rule)}
.bar{margin-bottom:var(--s2);gap:var(--s2);flex-wrap:nowrap}
.bar input{flex:0 1 220px;height:28px;padding:0 var(--s2)}
.chips{flex:1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;background:none;gap:4px}
.chips::-webkit-scrollbar{display:none}
.chips button{height:28px;padding:0 10px;border:1px solid var(--rule);background:transparent;white-space:nowrap}
.chips button[aria-pressed="true"]{border-color:var(--amb)}
.xbar{padding:var(--s1) var(--s2);margin-bottom:var(--s2)}
.cross{height:22px}
.bk{table-layout:auto}
.bk th{font-size:11px;padding:var(--s1) var(--s2);position:sticky;top:0;background:var(--bg)}
.bk td{height:var(--rowh);padding:0 var(--s2);border-bottom:1px solid var(--p2)}
.bk tr.lv td:first-child{box-shadow:inset 2px 0 transparent}
.bk tr.sel td{background:transparent!important}
.bk tr.sel td:first-child{box-shadow:inset 2px 0 var(--amb)}
.bk tr.sel td{color:var(--amb)}
.bk .c-a{width:1%;padding:0 2px}
.bk .c-t{width:1%}
.u2{color:var(--dim)}
.flag{font-size:9.5px;line-height:13px;padding:0 3px}
.leg2{grid-template-columns:84px minmax(0,1fr) 84px;padding:var(--s2) 0;gap:var(--s2)}
.leg2 input,.leg2 .v{font-size:16px}
.leg2 select{height:30px;width:100%}
.bal2{margin:var(--s1) 0 0}
.swap{margin:var(--s1) 0 0}
.swap button{height:24px}
.rate{padding:var(--s2) 0;font-size:11.5px}
.ttl{margin:var(--s3) 0 var(--s2)}
.ttl button{height:30px;padding:0}
.go{height:44px;padding:0;margin-top:var(--s2);letter-spacing:.04em}
.msg{margin-top:var(--s2);min-height:16px;font-size:11.5px}
.pipe{gap:var(--s3);margin-top:var(--s1);font-size:11.5px}
.mode{margin:var(--s2) 0 0}
.tabs2{margin-bottom:var(--s2);padding-bottom:var(--s2);border-bottom:1px solid var(--rule)}
.tp td,.tp th{height:28px;padding:0 var(--s2)}
.tp th{font-size:11px}
.foot{padding:var(--s2) var(--s4);gap:var(--s3);font-size:11.5px}
@media(pointer:coarse){.foot span:last-child{display:none}.fbar kbd{display:none}}
@media(max-width:640px){
  body{font-size:13px}
  .pane{padding:var(--s3)}
  .bar{flex-wrap:wrap}
  .bar input{flex:1 1 100%}
  .bk thead{display:none}
  .bk tbody{display:block}
  .bk tr.lv,.bk tr:not(.lv){display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"s a b t" "p p p m";align-items:center;column-gap:6px;padding:var(--s2) 0;border-bottom:1px solid var(--p2)}
  .bk td{height:auto;padding:0;border:0;text-align:left}
  .bk .c-s{grid-area:s}.bk .c-a{grid-area:a}.bk .c-b{grid-area:b}.bk .c-t{grid-area:t;text-align:right}
  .bk .c-p{grid-area:p;font-size:11.5px;color:var(--dim)}.bk .c-m{grid-area:m;text-align:right;font-size:11.5px}
  .bk tr.sel{box-shadow:inset 2px 0 var(--amb);padding-left:var(--s2)}
  .bk tr.sel td:first-child{box-shadow:none}
  .tp th:last-child,.tp td:last-child{display:none}
  .foot{justify-content:space-between}
}

.grid{background:var(--bg);gap:0;min-height:calc(100dvh - 66px)}
.tape{border-top:1px solid var(--rule)}
@media(min-width:900px){.grid{grid-template-rows:auto 1fr} #ticket{border-left:1px solid var(--rule);align-self:stretch;position:static}
  #ticket>*{position:relative} .tk-sticky{position:sticky;top:31px}}
.bk td.c-s,.bk th.c-s{text-align:right}
.bal2{display:flex;justify-content:flex-end;align-items:center;gap:var(--s3)}
.lnk{background:none;border:0;color:var(--cy);padding:0}
.swp{background:none;border:1px solid var(--rule);color:var(--dim);height:22px;padding:0 8px}
@media(max-width:640px){
  .bk tr.lv,.bk tr:not(.lv){grid-template-columns:auto auto minmax(0,1fr) 118px}
  .bk td.c-s{text-align:left}
  .bk .c-t,.bk .c-a{width:auto}
  .fbar .st{display:none}
  .fbar button{flex:1}
}

/* ---- wallet e bordi ---- */
.fbar .wbtn{background:#000;color:var(--amb);border:0;padding:7px 14px;font-weight:700;white-space:nowrap}
.fbar .wbtn.on{font-weight:500}
:root[data-theme="light"] .fbar .wbtn{background:#141414}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{width:100%;max-width:440px;background:var(--p1);border-top:2px solid var(--amb);padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.sheet{align-items:center}.sheet .box{border:1px solid var(--rule);border-top:2px solid var(--amb)}}
.opt{display:flex;align-items:center;gap:10px;width:100%;height:46px;margin-top:8px;padding:0 14px;border:1px solid var(--rule);background:var(--p2);font-weight:700;text-align:left}
.opt img{width:22px;height:22px}
.opt.ghost{background:transparent;color:var(--amb);border-color:var(--amb)}
.shn{color:var(--dim);font-size:12px;margin:10px 0 0;line-height:1.5}
.cls{display:block;margin:14px auto 0}
.kvw{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-bottom:6px}
.kvw span{color:var(--dim)} .kvw b{text-align:right;font-weight:500}
.foot{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
@media(max-width:640px){
  .pane{padding:14px 18px}
  #ticket{padding-bottom:20px}
  .tape{padding-bottom:18px}
  .foot{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px))}
  .foot #acct{grid-column:1/-1}
  .foot #trs{grid-column:1/-1}
  .foot button{justify-self:start}
  .fbar button{flex:0 0 auto}
  .fbar .sp{flex:1}
  .fbar .st{display:none}
}

@media(max-width:640px){
  .fbar{overflow:hidden}
  .fbar kbd{display:none}
  .fbar button,.fbar .logo{padding:9px 10px}
  .fbar .wbtn{margin-left:auto;padding:9px 12px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .foot span:last-child{display:none}
  .foot #fee{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="fbar" role="toolbar">
  <div class="logo">JABBA</div>
  <button data-view="book" aria-pressed="true"><kbd>F1</kbd>LIBRO</button>
  <button data-view="new" aria-pressed="false"><kbd>F2</kbd>NUOVO</button>
  <button data-view="mine" aria-pressed="false"><kbd>F3</kbd>ORDINI</button>
  <div class="sp"></div>
  <div class="st" id="st">RH 4663</div>
  <button class="wbtn" id="wbtn" aria-haspopup="dialog">CONNETTI</button>
</div>

<div class="grid">
  <section class="pane" id="bookPane"></section>
  <section class="pane" id="ticket"></section>
  <section class="pane tape" id="tape"></section>
</div>
<div class="foot">
  <span id="acct"></span><span id="fee"></span><span id="trs"></span>
  <button id="theme">tema</button><button id="reset">reset</button>
  <span>tasti: / filtra · N nuovo ordine · Invio esegue · Esc annulla</span>
</div>

<div class="sheet hide" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="box" id="sheetBox"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js"></script>
<script>
(() => {
"use strict";
const E = window.ethers, $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- protocollo (identico alla specifica v2.3) ---------------- */
const CHAIN_ID=4663, PERMIT2="0x000000000022D473030F116dDEE9F6B43aC78BA3";
const JABBA="0x5eed00000000000000000000000000000000a11c", TREASURY="0x7ea5000000000000000000000000000000000001";
const DOMAIN={name:"Permit2",chainId:CHAIN_ID,verifyingContract:PERMIT2};
const TYPES={PermitWitnessTransferFrom:[{name:"permitted",type:"TokenPermissions"},{name:"spender",type:"address"},{name:"nonce",type:"uint256"},{name:"deadline",type:"uint256"},{name:"witness",type:"Order"}],
  TokenPermissions:[{name:"token",type:"address"},{name:"amount",type:"uint256"}],Order:[{name:"buyToken",type:"address"},{name:"buyAmount",type:"uint256"}]};
const ENC=E.TypedDataEncoder.from(TYPES), ABI=E.AbiCoder.defaultAbiCoder();
const now=()=>Math.floor(Date.now()/1000), T0=now();
const TK={
  USDG:{sym:"USDG",dec:6,kind:"erc20",addr:"0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"},
  NVDA:{sym:"NVDA",dec:18,kind:"stock",mult:1,addr:"0x0000000000000000000000000000000000057001",ref:184.2},
  AAPL:{sym:"AAPL",dec:18,kind:"stock",mult:1,newMult:1.004,effectiveAt:T0+40*60,addr:"0x0000000000000000000000000000000000057002",ref:231.4},
  WETH:{sym:"WETH",dec:18,kind:"erc20",addr:"0x00000000000000000000000000000000000e7401",ref:3152},
  TSLA:{sym:"TSLA",dec:18,kind:"stock",mult:1,addr:"0x0000000000000000000000000000000000057003",ref:248.7},
  PEPE:{sym:"PEPE",dec:18,kind:"fot",addr:"0x0000000000000000000000000000000000fee001"}
};
const PAIRS=["NVDA","AAPL","WETH"];
const tok=a=>Object.values(TK).find(t=>t.addr.toLowerCase()===String(a).toLowerCase());
const tv=o=>({permitted:{token:o.sellToken,amount:o.sellAmount},spender:JABBA,nonce:o.nonce,deadline:o.deadline,witness:{buyToken:o.buyToken,buyAmount:o.buyAmount}});
const oHash=o=>E.keccak256(ABI.encode(["address","bytes32"],[o.maker,ENC.hashStruct("PermitWitnessTransferFrom",tv(o))]));
const rnd=()=>BigInt(E.hexlify(E.randomBytes(31)));
async function sign(w,o){const sig=await w.signTypedData(DOMAIN,TYPES,tv(o));const f={...o,maker:w.address,sig};f.hash=oHash(f);return f;}

/* ---------------- chain simulata ---------------- */
let S, ME, MK;
const k=(a,b)=>a.toLowerCase()+":"+b.toLowerCase();
const bal=(w,t)=>S.bal[k(w,t.addr)]??0n, setB=(w,t,v)=>S.bal[k(w,t.addr)]=v, alw=(w,t)=>S.alw[k(w,t.addr)]??0n;
const nUsed=(w,n)=>(((S.bm[k(w,(n>>8n).toString(16))]??0n)>>(n&255n))&1n)===1n;
const nUse=(w,n)=>{const kk=k(w,(n>>8n).toString(16));S.bm[kk]=(S.bm[kk]??0n)|(1n<<(n&255n));};
const d7702=w=>(S.code[w.toLowerCase()]??"").startsWith("0xef0100");
function xfer(t,f,to,a){if(bal(f,t)<a)throw Error("saldo insufficiente");if(alw(f,t)<a)throw Error("approve insufficiente");
  S.alw[k(f,t.addr)]=alw(f,t)-a;setB(f,t,bal(f,t)-a);setB(to,t,bal(to,t)+(t.kind==="fot"?a-a/100n:a));}

function flags(o){ // requisiti del terminale
  const f=[], s=tok(o.sellToken), b=tok(o.buyToken);
  if(o.deadline<=BigInt(now())||nUsed(o.maker,o.nonce)||bal(o.maker,s)<o.sellAmount||alw(o.maker,s)<o.sellAmount) f.push(["x","KO"]);
  if(s.kind==="fot"||b.kind==="fot") f.push(["x","FOT"]);
  if(d7702(o.maker)) f.push(["w","7702"]);
  for(const t of [s,b]) if(t.newMult&&o.deadline>BigInt(t.effectiveAt)) f.push(["w","CA"]);
  return f;
}
const dead=o=>o.status!=="open"||flags(o).some(([c])=>c==="x");

function match(A,B,sub,val,dry){
  const snap=structuredClone(S);
  const ko=m=>{S=snap;return{ok:false,err:m};};
  try{
    if(A.maker.toLowerCase()===B.maker.toLowerCase())return ko("SelfMatch");
    if(A.sellToken!==B.buyToken||B.sellToken!==A.buyToken)return ko("TokenMismatch");
    if(A.sellAmount<B.buyAmount||B.sellAmount<A.buyAmount)return ko("PriceNotCrossed");
    if(val!==S.fee)return ko("WrongFee");
    for(const o of [A,B]){
      if(o.deadline<BigInt(now()))return ko("SignatureExpired");
      if(nUsed(o.maker,o.nonce))return ko("InvalidNonce");
      if(E.verifyTypedData(DOMAIN,TYPES,tv(o),o.sig).toLowerCase()!==o.maker.toLowerCase())return ko("InvalidSigner");
      nUse(o.maker,o.nonce);
    }
    const ab=tok(A.buyToken),bb=tok(B.buyToken),a0=bal(A.maker,ab),b0=bal(B.maker,bb);
    xfer(tok(A.sellToken),A.maker,B.maker,A.sellAmount); xfer(tok(B.sellToken),B.maker,A.maker,B.sellAmount);
    if(bal(A.maker,ab)-a0<B.sellAmount||bal(B.maker,bb)-b0<A.sellAmount)return ko("ShortReceipt");
    const e=S.eth[sub.toLowerCase()]??0n; if(e<val)return ko("ETH insufficiente");
    S.eth[sub.toLowerCase()]=e-val; S.trs+=val;
    if(dry){S=snap;return{ok:true};}
    for(const o of S.orders) if(o.hash===A.hash||o.hash===B.hash)o.status="filled";
    S.tape.unshift({t:now(),A,B,sub,fee:val});
    return{ok:true};
  }catch(e){return ko(String(e.message));}
}

async function execute(){

  } else {

    const s=await sign(ME,{...o,nonce:rnd(),deadline:BigInt(now()+U.ttl)}); s.status="open"; s.t=now(); S.orders.push(s);
    await pause(300); U.run[1][1]="ok";U.run[2][1]="ok"; U.msg=["","ordine "+s.hash.slice(0,10)+"… nel libro"]; U.sa=""; U.ba="";

document.addEventListener("click",async e=>{
  if(e.target.id==="sheet")return closeSheet();
  const b=e.target.closest("button,tr.lv"); if(!b)return;
  if(b.matches("tr.lv")){const o=S.orders.find(x=>x.hash===b.dataset.o); if(!o||dead(o)||o.maker===ME?.address)return; if(!ME)return openSheet(); U.sel=o;U.run=null;U.msg=null;U.view="book";render();if(innerWidth<900)$("#ticket").scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return;}
  if(b.dataset.chip){U.chip=b.dataset.chip;return renderBook();}
  if(b.dataset.ttl){U.ttl=+b.dataset.ttl;return renderTicket();}
  if(b.dataset.swap!==undefined){[U.sell,U.buy,U.sa,U.ba]=[U.buy,U.sell,U.ba,U.sa];return renderTicket();}
  if(b.dataset.max!==undefined){const t=TK[U.sell];U.sa=String(num(bal(ME.address,t),t));return renderTicket();}
  if(b.dataset.clear!==undefined){reset();return render();}
  if(b.dataset.tape){U.tape=b.dataset.tape;return renderTape();}
  if(b.dataset.view){U.view=b.dataset.view;
    if(U.view==="new"){reset();render();$("#ticket").scrollIntoView({block:"start"});$("#sa")?.focus();return;}
    if(U.view==="mine"){U.tape="mine";render();$("#tape").scrollIntoView({block:"start"});return;}
    return render();}
  if(b.dataset.cancel){const o=S.orders.find(x=>x.hash===b.dataset.cancel);nUse(o.maker,o.nonce);o.status="cancelled";return render();}
  if(b.dataset.cross!==undefined){const c=crossing(); if(!c)return; const r=match(c[0],c[1],ME.address,S.fee,false);
    U.msg=r.ok?["","match eseguito tra due maker · surplus a loro"]:["e","revert: "+r.err]; if(r.ok){U.flash=true;U.tape="fills";} return render();}
  if(b.id==="wbtn"||b.dataset.connect!==undefined)return openSheet();
  if(b.dataset.w){const v=b.dataset.w; if(v==="close")return closeSheet(); if(v==="off")return disconnect(); if(v==="demo")return connectDemo(); return connectInjected(providers()[+v.slice(1)]);}
  if(b.dataset.cross!==undefined&&!ME)return openSheet();
  if(b.id==="go"&&!b.disabled)return execute();
  if(b.id==="reset"){reset();await seed();return render();}
  if(b.id==="sheet")return closeSheet();
  if(b.id==="theme"){const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light";try{localStorage.setItem("pswp-th",r.dataset.theme);}catch{}}
});
document.addEventListener("input",e=>{const id=e.target.id;
  if(id==="flt"){U.f=e.target.value;const p=e.target.selectionStart;renderBook();const el=$("#flt");el.focus();try{el.setSelectionRange(p,p);}catch{}return;}
  if(id==="sa"||id==="ba"){U[id]=e.target.value;U.msg=null;U.run=null;const p=e.target.selectionStart;renderTicket();const el=$("#"+id);el.focus();try{el.setSelectionRange(p,p);}catch{}}});
document.addEventListener("change",e=>{if(e.target.id==="sell"||e.target.id==="buy"){U[e.target.id]=e.target.value;U.msg=null;renderTicket();}});
document.addEventListener("keydown",e=>{
  if(e.target.matches("tr.lv")&&e.key==="Enter"){e.target.click();return;}
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"){if(e.key==="Enter"&&e.target.id!=="flt")$("#go")?.click(); if(e.key==="Escape")e.target.blur(); return;}
  if(e.key==="/"){e.preventDefault();$("#flt")?.focus();}
  else if(e.key==="n"||e.key==="N"){document.querySelector('[data-view="new"]').click();}
  else if(e.key==="Enter"){$("#go")?.click();}
  else if(e.key==="Escape"){if(!$("#sheet").classList.contains("hide"))return closeSheet();reset();render();}
  else if(["F1","F2","F3"].includes(e.key)){e.preventDefault();document.querySelector(`[data-view="${["book","new","mine"][+e.key[1]-1]}"]`).click();}
});
try{const th=localStorage.getItem("pswp-th");if(th)document.documentElement.dataset.theme=th;}catch{}
seed().then(render);
setInterval(()=>{if(!U.busy&&document.activeElement?.id!=="flt")renderBook();},20000);
})();
</script>
</body>
</html>
