name: test

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vvv

  halmos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install halmos==0.3.3
      - run: forge build --ast
      # Invarianti I1–I8 e hash (§12 passo 8); test in test/formal/JabbaHalmos.t.sol
      - run: halmos --contract JabbaHalmos --loop 8 --solver-timeout-assertion 0
